<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar(type)">
    <!-- Book Specific Sidebar -->
    <div th:if="${type == 'books'}">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Find Books</h5>
            </div>
            <div class="card-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary text-start" id="btnAll">Show All</button>
                    <button class="btn btn-outline-primary text-start" id="btnAvailable">Show Available Only</button>

                    <div class="dropdown w-100">
                        <button class="btn btn-outline-primary dropdown-toggle w-100 text-start" data-bs-toggle="dropdown"
                                type="button">
                            Filter By...
                        </button>
                        <ul class="dropdown-menu w-100">
                            <li><a class="dropdown-item" href="#" id="linkByYear">By Year</a></li>
                            <li><a class="dropdown-item" href="#" id="linkByAuthor">By Author Name</a></li>
                            <li><a class="dropdown-item" href="#" id="linkByGenre">By Genre</a></li>
                            <li><a class="dropdown-item" href="#" id="linkByTitle">By Title</a></li>
                        </ul>
                    </div>

                    <button class="btn btn-outline-primary text-start" id="btnGrouped">Grouped by Genre</button>
                    <button class="btn btn-outline-primary text-start" id="btnGenresList">Genres List</button>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2 mb-4" sec:authorize="hasRole('ADMIN')">
            <button class="btn btn-success" id="btnShowCreateForm">Create New Book</button>
        </div>
    </div>

    <!-- Author Specific Sidebar -->
    <div th:if="${type == 'authors'}">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Author Actions</h5>
            </div>
            <div class="card-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary text-start" id="btnAllAuthors">Show All Authors</button>
                    <div class="mb-3 mt-2">
                        <label class="form-label small" for="searchAuthorName">Find Author</label>
                        <div class="input-group input-group-sm">
                            <input class="form-control" id="searchAuthorName" placeholder="Name..." type="text">
                            <button class="btn btn-primary" id="btnSearchAuthor" type="button">Find</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-grid gap-2 mb-4" sec:authorize="hasRole('ADMIN')">
            <button class="btn btn-success" id="btnShowCreateAuthor">Add New Author</button>
        </div>
    </div>

    <!-- Report Specific Sidebar -->
    <div th:if="${type == 'reports'}">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Report Filters</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" for="reportType">Report Type</label>
                    <select class="form-select" id="reportType">
                        <option th:each="type : ${T(org.mystudying.bookmanagementauth.dto.booking.BookingReportType).values()}"
                                th:text="${type.name().replace('_', ' ')}" th:value="${type}">Report Type
                        </option>
                    </select>
                </div>
                <div class="mb-3" id="daysInputContainer" style="display: none;">
                    <label class="form-label" for="days">Days</label>
                    <input class="form-control" id="days" type="number" value="7">
                </div>
                <div class="mb-3" id="minActiveBooksInputContainer" style="display: none;">
                    <label class="form-label" for="minActiveBooks">Min Active Books</label>
                    <input class="form-control" id="minActiveBooks" type="number" value="3">
                </div>
                <button class="btn btn-primary w-100" id="btnRunReport">Run Report</button>
            </div>
        </div>
    </div>

    <!-- Failed Mail Sidebar -->
    <div th:if="${type == 'failed_mails'}">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Mail Filters</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" for="filterEmail">To Email</label>
                    <input class="form-control" id="filterEmail" placeholder="Email..." type="text">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="startDate">From Date</label>
                    <input class="form-control" id="startDate" type="datetime-local">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="endDate">To Date</label>
                    <input class="form-control" id="endDate" type="datetime-local">
                </div>
                <button class="btn btn-primary w-100" id="btnApplyMailFilter">Filter Mails</button>
            </div>
        </div>
    </div>

    <!-- User Profile Sidebar -->
    <div th:if="${type == 'user_profile'}">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">User Actions</h5>
            </div>
            <div class="list-group list-group-flush" id="user-sidebar-list">
                <button class="list-group-item list-group-item-action active" id="btnPersonalInfo" type="button">
                    Personal Info
                </button>
                <button class="list-group-item list-group-item-action" id="btnActiveBookings" type="button">Borrowed
                    books
                </button>
                <button class="list-group-item list-group-item-action" id="btnAllBookings" type="button">All Bookings
                </button>
                <button class="list-group-item list-group-item-action text-danger" id="btnToggleActiveStatus"
                        sec:authorize="hasRole('ADMIN')" type="button">Deactivate/Activate
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
