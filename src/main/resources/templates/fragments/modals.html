<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modals">
    <!-- Generic Modal Overlay -->
    <div id="modal-overlay" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">Notification</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modal-message"></p>
                    <div id="modal-prompt-container" class="d-none mt-3">
                        <input type="text" id="modal-prompt-input" class="form-control">
                    </div>
                </div>
                <div class="modal-footer" id="modal-buttons">
                    <!-- Buttons will be dynamic -->
                </div>
            </div>
        </div>
    </div>

    <!-- Password Reset Request Modal -->
    <div id="password-reset-request-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Reset Your Password</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Enter your email address and we'll send you a link to reset your password.</p>
                    <form id="passwordResetRequestForm">
                        <div class="mb-3">
                            <label for="resetEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="resetEmail" name="email" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="btnSubmitResetRequest">Send Reset Link</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
