<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::section}, '')}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Management - Library Management</title>
</head>
<body>
<section sec:authorize="hasRole('ADMIN')">
    <h1 class="mb-4">User Management</h1>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" id="btnShowAll">Show All Users</button>
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <input class="form-control" id="searchInput" placeholder="Find by Name or Email..." type="text">
                        <button class="btn btn-outline-secondary" id="btnSearch">Search</button>
                    </div>
                </div>
                <div class="col-md-3 text-end">
                    <button class="btn btn-success" id="btnShowCreate">Create New User</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">User List</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="user-list-body">
                    <!-- User rows will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-center align-items-center" id="pagination-controls"
             style="display: none;">
            <button class="btn btn-outline-secondary btn-sm" id="prev-page">Previous</button>
            <span class="mx-3 text-muted" id="page-info"></span>
            <button class="btn btn-outline-secondary btn-sm" id="next-page">Next</button>
        </div>
    </div>

    <!-- Create User Modal -->
    <div class="modal fade" id="createUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New User</h5>
                    <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <div class="modal-body">
                    <form id="createUserForm">
                        <div class="mb-3">
                            <label class="form-label" for="create-name">Name</label>
                            <input class="form-control" id="create-name" name="name" required type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="create-email">Email</label>
                            <input class="form-control" id="create-email" name="email" required type="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="create-password">Password</label>
                            <input class="form-control" id="create-password" name="password" required type="password">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
                    <button class="btn btn-primary" id="btnSubmitCreate" type="button">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Specific Scripts -->
    <script th:src="@{/js/api/usersApi.js}"></script>
    <script th:src="@{/js/pages/users.js}"></script>
</section>
</body>
</html>
