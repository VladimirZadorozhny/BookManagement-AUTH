<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Overdue Notification</title>
</head>
<body>
    <p>Dear <span th:text="${userName}">User</span>,</p>

    <p>This is an urgent reminder that your borrowed book <strong>'<span th:text="${bookTitle}">Book Title</span>'</strong> was due on <span th:text="${dueDate}">[Due Date]</span> and is now overdue.</p>
    <p>Please return the book immediately to minimize any accumulated fines.</p>

    <p>Thank you!</p>
</body>
</html>
