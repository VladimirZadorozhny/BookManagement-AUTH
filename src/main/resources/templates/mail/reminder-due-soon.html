<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Due Soon Reminder</title>
</head>
<body>
    <p>Dear <span th:text="${userName}">User</span>,</p>

    <p>This is a friendly reminder that your borrowed book <strong>'<span th:text="${bookTitle}">Book Title</span>'</strong> is due in 3 days, on <span th:text="${dueDate}">[Due Date]</span>.</p>
    <p>Please return it on time to avoid any late fees.</p>

    <p>Thank you!</p>
</body>
</html>
