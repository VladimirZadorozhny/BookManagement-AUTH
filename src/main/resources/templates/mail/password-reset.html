<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Request</title>
</head>
<body>
    <p>Dear <span th:text="${userName}">User</span>,</p>

    <p>You have requested to reset your password for the Book Management application.</p>
    <p>Please click the link below to reset your password:</p>

    <p>
        <a th:href="${resetLink}">Reset Password</a>
    </p>

    <p>This link is valid for 2 hours. If you did not request a password reset, please ignore this email.</p>
    <p>Thank you!</p>
</body>
</html>
